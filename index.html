<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Romantic Matrix Heart Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
    }
    #matrixCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.65;
    }
    #heartCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }
    #textOverlay {
      position: absolute;
      z-index: 3;
      color: #fff;
      font-size: 5rem;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 0 10px #ff2a7a, 0 0 25px #ff2a7a, 0 0 50px #ff0055;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .heart-text {
      font-size: 3.5rem !important;
      font-family: 'Brush Script MT', cursive, sans-serif;
    }
  </style>
</head>
<body>

  <canvas id="matrixCanvas"></canvas>
  
  <canvas id="heartCanvas"></canvas>

  <div id="textOverlay">3</div>

  <script>
    // --- 1. MATRIX RAIN EFFECT ---
    const mCanvas = document.getElementById('matrixCanvas');
    const mCtx = mCanvas.getContext('2d');

    mCanvas.width = window.innerWidth;
    mCanvas.height = window.innerHeight;

    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ💖✦✧';
    const fontSize = 16;
    const columns = Math.floor(mCanvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawMatrix() {
      mCtx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);

      mCtx.fillStyle = '#ff2a7a'; // पिंक मैट्रिक्स रेन
      mCtx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        mCtx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > mCanvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    // --- 2. TEXT COUNTDOWN & SEQUENCE ---
    const textOverlay = document.getElementById('textOverlay');
    const sequence = ["3", "2", "1", "You", "Are", "My", "I Love You"];
    let seqIndex = 0;

    function runSequence() {
      if (seqIndex < sequence.length) {
        textOverlay.style.opacity = '0';
        textOverlay.style.transform = 'scale(0.5)';

        setTimeout(() => {
          textOverlay.textContent = sequence[seqIndex];
          if (sequence[seqIndex] === "I Love You") {
            textOverlay.classList.add('heart-text');
            startHeartParticles();
          }
          textOverlay.style.opacity = '1';
          textOverlay.style.transform = 'scale(1.1)';
          seqIndex++;
        }, 300);

        setTimeout(runSequence, 1200);
      }
    }

    // --- 3. GLOWING HEART PARTICLES ---
    const hCanvas = document.getElementById('heartCanvas');
    const hCtx = hCanvas.getContext('2d');
    hCanvas.width = window.innerWidth;
    hCanvas.height = window.innerHeight;

    let particles = [];
    let heartRunning = false;

    function heartFunction(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return {
        x: x * scale + hCanvas.width / 2,
        y: y * scale + hCanvas.height / 2
      };
    }

    function startHeartParticles() {
      heartRunning = true;
      const count = 450;
      for (let i = 0; i < count; i++) {
        const t = Math.PI * 2 * (i / count);
        const pos = heartFunction(t, 14);
        particles.push({
          x: pos.x + (Math.random() - 0.5) * 12,
          y: pos.y + (Math.random() - 0.5) * 12,
          size: Math.random() * 2.5 + 1.2,
          alpha: Math.random() * 0.7 + 0.3,
          speed: Math.random() * 0.04 + 0.01
        });
      }
    }

    function drawHeart() {
      if (!heartRunning) return;
      hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);

      particles.forEach(p => {
        hCtx.beginPath();
        hCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        hCtx.fillStyle = `rgba(255, 105, 180, ${p.alpha})`;
        hCtx.shadowBlur = 15;
        hCtx.shadowColor = '#ff1493';
        hCtx.fill();

        // हल्की सी स्पार्कल/पल्स मूवमेंट
        p.alpha += Math.sin(Date.now() * p.speed) * 0.02;
      });
    }

    // --- MAIN ANIMATION LOOP ---
    function animate() {
      drawMatrix();
      drawHeart();
      requestAnimationFrame(animate);
    }

    animate();
    setTimeout(runSequence, 600);

    // स्क्रीन रिसाइज हैंडलर
    window.addEventListener('resize', () => {
      mCanvas.width = window.innerWidth;
      mCanvas.height = window.innerHeight;
      hCanvas.width = window.innerWidth;
      hCanvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
